<div class="position-relative overflow-hidden p-3 p-md-5 text-center bg-white">
  <div class="col-md-5 p-lg-5 mx-auto my-5">
    <h1 class="display-4 fw-normal"> 
      {{ TITLE }}
    </h1>
    <p class="lead fw-normal">名古屋B級グルメに特化したレビューアプリです。</p>
  </div>
  <div class="product-device shadow-sm d-none d-md-block"></div>
  <div class="product-device product-device-2 shadow-sm d-none d-md-block"></div>

  <div class="row my-5">
    <div class="col-md-8 col-lg-6 mx-auto">
      <form method="GET" action="restaurants/">
        {% csrf_token %}
        <div class="input-group">
          <input type="text" name="name" placeholder="店舗名で検索" class="form-control">
          <button class="btn btn-warning px-4 shadow-sm" type="submit">検索</button>
        </div>
      </form>
    </div>
  </div>
</div>
