{% load static %}

<a href="/restaurants/{{object.pk}}/">
  <div class="border">
    {% if not object.image %} 
      <img src="{% static 'restaurants/noImage.png' %}" width="100%" class=" bg-white">
    {% else %}
      <img src="{{object.image.url}}" width="100%" class=" bg-white">
    {% endif %}

    <div class="text-center text-secondary overflow-hidden">
      <div class="my-2 py-2">
        <h2 class="lead">{{object.name}}</h2>
      </div>
    </div>
  </div>
</a>
