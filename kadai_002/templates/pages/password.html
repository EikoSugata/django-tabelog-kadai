{% extends 'base.html' %}

{% block main %}

  <div class="container my-5">
    <div class="row">
      <div class="col-12">
        <h1>Account</h1>
        <form method="POST">
          {% csrf_token %}
          {% for field in form %}
            <div class="form-row">
              <div class="form-group col-md-6">
                <label>{{ field.label }}</label>
                <input 
                  type="password" 
                  name="{{ field.name }}" 
                  class="form-control 
                    {% if field.errors %}
                      is-invalid
                    {% endif %}"
                  required
                >
                <!-- エラーメッセージがある場合 -->
                {% if field.errors %}
                  <div class="invalid-feedback">
                    {{ field.errors.0 }}
                  </div>
                {% endif %}
                <!-- パスワードのルール説明（8文字以上など） -->
                {% if field.help_text %}
                  <small class="form-text text-muted">{{ field.help_text }}</small>
                {% endif %}
              </div>
            </div>
          {% endfor %}
          <button type="submit" class="btn btn-info shadow-sm">Save</button>
        </form>
      </div>
    </div>
  </div>

{% endblock %}
